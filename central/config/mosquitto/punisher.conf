# Punisher — Broker-Einstellung (2.1.1)
#
# Nach /etc/mosquitto/conf.d/punisher.conf kopieren, dann
#   systemctl restart mosquitto
#
# Die beiden ersten Zeilen sind die, auf denen alles andere steht. Ohne sie ist
# die Zugriffsliste Zierde: ein Broker, der anonyme Verbindungen annimmt,
# fragt nie nach einem Benutzer, und ohne Benutzer trifft keine `user`-Zeile
# der Liste zu.

allow_anonymous false
password_file /etc/mosquitto/punisher.passwd
acl_file /etc/mosquitto/punisher.acl

# WER HIER HEREINKOMMT
#
# Zentrale, Webinterface und Anzeige laufen auf demselben Pi und sprechen ueber
# localhost; die GERAETE kommen ueber das WLAN der Anlage. Diese eine Zeile
# bedient beide Wege.
#
# Bis 2.2 stand hier "Nur lokal" — das war falsch. `listener 1883` OHNE Adresse
# bindet auf alle Adressen, und das muss es auch, sonst erreichte kein Geraet
# den Broker. Der Kommentar behauptete das Gegenteil dessen, was die Zeile tut
# (Fund 16.09.2026, Doc 53). Wer wirklich nur lokal will, schreibt
# `listener 1883 localhost` — und dann kommt kein Geraet mehr herein, ausser
# ueber den TLS-Listener unten.
listener 1883


# --------------------------------------------------------------------------
# TLS (2.3, Doc 53) — auskommentiert, weil die Vorgabe dieses Standes Klartext
# ist. Das ist Absicht: wer die Anlage nachbaut, soll sie zum Laufen bringen,
# ohne vorher ein Zertifikat zu erzeugen (Entscheidung Philine 2026-09-16).
#
# WAS TLS HIER LOEST: ueber das WLAN geht sonst alles im Klartext — Zustaende,
# Namen, Impulsstufen, und beim Verbinden das Passwort von `punisher-device`.
# Wer mitschneidet, liest es mit.
#
# WAS ES NICHT LOEST: die Geraete pruefen das Zertifikat nicht (Vorgabe). Gegen
# jemanden, der im WLAN aktiv umleitet und sich als Broker ausgibt, hilft das
# nicht — er wird dann selbst der Endpunkt. Steuern kann er trotzdem nichts:
# jeder Befehl ist signiert, und den Projektschluessel hat er nicht.
#
# EINSCHALTEN
#   sudo bash tools/mqtt_tls.sh <brokername>     erzeugt Zertifikat und Schluessel
#   die vier Zeilen unten einkommentieren
#   systemctl restart mosquitto
#   config.ini [mqtt]: port = 8883, tls = 1
#   jede creds.h: MQTT_TLS 1, MQTT_PORT 8883 — und neu flashen
#
# Und DANN, erst dann, die Zeile oben auf `listener 1883 localhost` aendern:
# ueber die Luft geht dann nur noch der verschluesselte Weg. Vorher waere es
# ein Ausschluss aller Geraete.
#
#listener 8883
#certfile /etc/mosquitto/certs/punisher.crt
#keyfile /etc/mosquitto/certs/punisher.key
#tls_version tlsv1.2

# Die Zustaende der Geraete liegen retained am Broker (`available`, `state`,
# `hello`) und muessen einen Neustart ueberleben: sonst steht die Anlage nach
# einem Stromausfall ohne Geraeteliste da, bis jedes Geraet sich von selbst
# wieder meldet.
persistence true
persistence_location /var/lib/mosquitto/

# Ein abgewiesener Zugriff soll AUFFALLEN. Ohne diese Zeile schweigt der
# Broker, und ein Geraet mit falschem Konto sieht aus wie eines mit
# Wackelkontakt — genau der Fehler, den die Anlage an anderen Stellen
# ausdruecklich laut macht.
log_type error
log_type warning
log_type notice
